services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: policy
      POSTGRES_PASSWORD: policy        # local development only
      POSTGRES_DB: policy_copilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U policy -d policy_copilot"]
      interval: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    # After start: docker compose exec ollama ollama pull llama3.1:8b

volumes:
  postgres_data:
  qdrant_storage:
  ollama_models:
